const KEY="jojo190";
let L=JSON.parse(localStorage.getItem(KEY)||"{}");
let cur=-1; /* 索引 = pi*1000+n */
function lit(pi,n){return !!L[pi*1000+n]}
function cnt(pi){var p=DATA[pi],c=0;p.eps.forEach(function(e){if(lit(pi,+e.n))c++});return c}
function render(){
 var host=document.getElementById("parts");host.innerHTML="";
 DATA.forEach(function(p,pi){
  var d=document.createElement("section");d.className="part";d.style.setProperty("--pc",p.color);
  d.innerHTML='<div class="phead"><span class="pn">PART '+(pi+1)+'</span><span class="pcn">'+p.cn+
   '</span><span class="pen">'+p.en+'</span></div><div class="pcount"><b>'+cnt(pi)+'</b>/'+p.eps.length+'</div>'+
   '<div class="pmeta"><b>'+p.hero+'</b> · 替身 <b>'+p.stand+'</b> · '+p.year+' · 全 '+p.eps.length+' 话</div>'+
   '<div class="pquote">'+p.quote+'</div><div class="pintro">'+p.intro+'</div>';
  var g=document.createElement("div");g.className="grid";
  p.eps.forEach(function(e){
   var n=+e.n,el=document.createElement("div");el.className="ep"+(lit(pi,n)?" lit":"");
   el.innerHTML='<div class="no">'+n+'</div><div class="tt">'+e.t+'</div>';
   el.onclick=function(){openC(pi,n)};
   g.appendChild(el);
  });
  d.appendChild(g);host.appendChild(d);
 });
 var tot=0;DATA.forEach(function(p,pi){tot+=cnt(pi)});
 document.getElementById("tdone").textContent=tot;
 var pc=Math.round(tot/190*100);
 document.getElementById("tpct").textContent=tot===0?"石鬼面的百年物语，从第一话点亮":
  tot>=190?"六部全通 · 正是黄金精神":pc+"% · 沿着乔斯达的血脉继续";
}
function openC(pi,n){
 var p=DATA[pi],e=p.eps[n-1];cur=pi*1000+n;
 document.getElementById("card").style.setProperty("--pc",p.color);
 document.getElementById("cno").textContent="PART "+(pi+1)+" · "+p.cn+" · 第 "+n+" 话";
 document.getElementById("ctt").textContent=e.t;
 document.getElementById("cmeta").textContent=(e.d?"首播 "+e.d+" · ":"")+p.year;
 document.getElementById("chero").innerHTML=p.hero+"<span> 的物语 · </span>"+p.stand;
 var cd=document.getElementById("cdesc");
 if(e.s){cd.style.display="block";cd.textContent=e.s}
 else{cd.style.display="block";cd.textContent=p.intro}
 document.getElementById("card").classList.add("up");
 document.getElementById("ovl").classList.add("on");
}
function closeC(mark){
 if(mark&&cur>=0){L[cur]=1;localStorage.setItem(KEY,JSON.stringify(L));
  var pi=Math.floor(cur/1000),n=cur%1000,p=DATA[pi];
  toast("✓ P"+(pi+1)+"-"+n+" "+p.eps[n-1].t.slice(0,10)+" 点亮")}
 document.getElementById("card").classList.remove("up");
 document.getElementById("ovl").classList.remove("on");cur=-1;render();check();
}
document.getElementById("bdone").onclick=function(){closeC(true)};
document.getElementById("bclose").onclick=function(){closeC(false)};
document.getElementById("ovl").onclick=function(){closeC(false)};
function check(){
 var all=true;DATA.forEach(function(p,pi){p.eps.forEach(function(e){if(!lit(pi,+e.n))all=false})});
 if(all)setTimeout(function(){document.getElementById("badge").classList.add("on")},400);
}
var tmr=null;
function toast(t){var el=document.getElementById("toast");el.textContent=t;el.classList.add("on");
 clearTimeout(tmr);tmr=setTimeout(function(){el.classList.remove("on")},1800)}
render();
</script>
